<header class="site-header">
  <div class="nav-shell">
    <a class="site-brand" href="{{ '/' | prepend: site.baseurl }}">
      <strong>Bruna</strong> Zamith
    </a>

    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-navigation">
      <span class="sr-only">Toggle navigation</span>
      <span></span><span></span><span></span>
    </button>

    <nav id="site-navigation" class="site-navigation" aria-label="Main navigation">
      {% for link in site.navbar-links %}
        {% if link[1] == '' %}
          {% assign link_url = '/' %}
        {% else %}
          {% assign link_url = '/' | append: link[1] | append: '/' %}
        {% endif %}
        <a href="{{ link_url | prepend: site.baseurl }}"{% if page.url == link_url %} class="active"{% endif %}>{{ link[0] }}</a>
      {% endfor %}
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
        <span aria-hidden="true">◐</span>
      </button>
    </nav>
  </div>
</header>
